<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tableau Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #333;
    }
  </style>
</head>
<body>
  <h1>My Dashboard</h1>

  < https://public.tableau.com/app/profile/abigail.nzambi8327/viz/IndianEngineeringStudentPlacementDashboard/Detailsdashboard >
  <div class='tableauPlaceholder' id='viz123' style='position: relative'>
    <noscript>
      <a href='#'><img alt='Dashboard' src='https://public.tableau.com/static/images/YourImage.png' style='border: none' /></a>
    </noscript>
    <object class='tableauViz' style='display:none;'>
      <param name='host_url' value='https%3A%2F%2Fpublic.tableau.com%2F' />
      <param name='embed_code_version' value='3' />
      <param name='name' value='YourWorkbook/YourDashboardName' />
      <param name='tabs' value='no' />
      <param name='toolbar' value='yes' />
    </object>
  </div>
  <script type='text/javascript'>
    var divElement = document.getElementById('viz123');
    var vizElement = divElement.getElementsByTagName('object')[0];
    vizElement.style.width='100%';
    vizElement.style.height=(divElement.offsetWidth*0.75)+'px';
    var scriptElement = document.createElement('script');
    scriptElement.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';
    vizElement.parentNode.insertBefore(scriptElement, vizElement);
  </script>

</body>
</html>
